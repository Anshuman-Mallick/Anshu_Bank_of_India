<!DOCTYPE html>
<html>
<head>
    <title>ABI Admin Login</title>

    <style>

        body{
            font-family:Arial;
            background:#003a8f;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{

            background:white;

            padding:40px;

            border-radius:15px;

            width:320px;
        }

        input{

            width:100%;

            padding:12px;

            margin:10px 0;
        }

        button{

            width:100%;

            padding:12px;

            background:#003a8f;

            color:white;

            border:none;

            border-radius:8px;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>Admin Login</h2>

    <input type="text"
           id="userid"
           placeholder="Admin ID">

    <input type="password"
           id="password"
           placeholder="Password">

    <button onclick="adminLogin()">
        Login
    </button>

</div>

<script>

    async function adminLogin(){

        const data = {

            userId:
                document.getElementById("userid").value,

            password:
                document.getElementById("password").value
        };

        const response = await fetch(
            "http://localhost:8080/adminLogin",

            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(data)
            }
        );

        const result = await response.text();

        if(result === "Admin Success"){

            localStorage.setItem(
                "adminLogin",
                "true"
            );

            window.location.href =
                "admin.html";
        }

        else{

            alert("Invalid Admin Login");
        }
    }

</script>

</body>
</html>
