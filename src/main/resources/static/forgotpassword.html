<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ABI Bank - Forgot Password</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
        }

        body{

        height:100vh;

        display:flex;

        justify-content:center;

        align-items:center;

        background:linear-gradient(135deg,#003a8f,#009688);

        overflow:hidden;

        }

        .bg{

        position:absolute;

        width:100%;

        height:100%;

        background:rgba(255,255,255,.05);

        backdrop-filter:blur(3px);

        }

        .container{

        position:relative;

        width:460px;

        background:white;

        border-radius:20px;

        padding:35px;

        box-shadow:0 20px 40px rgba(0,0,0,.25);

        animation:popup .6s;

        }

        @keyframes popup{

        from{

        transform:scale(.7);

        opacity:0;

        }

        to{

        transform:scale(1);

        opacity:1;

        }

        }

        .logo{

        text-align:center;

        margin-bottom:25px;

        }

        .logo h1{

        color:#003a8f;

        font-size:34px;

        }

        .logo p{

        color:#777;

        margin-top:8px;

        }

        .input-box{

        margin-top:18px;

        position:relative;

        }

        .input-box input{

        width:100%;

        padding:14px 45px;

        border:1px solid #ddd;

        border-radius:12px;

        outline:none;

        font-size:15px;

        transition:.3s;

        }

        .input-box input:focus{

        border-color:#003a8f;

        box-shadow:0 0 10px rgba(0,58,143,.2);

        }

        .input-box i{

        position:absolute;

        left:15px;

        top:16px;

        color:#003a8f;

        }

       .eye{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#666;
    font-size:18px;
}

.eye:hover{
    color:#003a8f;
}

        button{

        width:100%;

        padding:15px;

        margin-top:25px;

        background:#003a8f;

        color:white;

        border:none;

        border-radius:30px;

        font-size:17px;

        cursor:pointer;

        transition:.3s;

        }

        button:hover{

        background:#002d6d;

        }

        .back{

        display:block;

        text-align:center;

        margin-top:18px;

        color:#003a8f;

        text-decoration:none;

        font-weight:bold;

        }

        .strength{

        margin-top:8px;

        font-size:13px;

        font-weight:bold;

        }

        .loading{

        display:none;

        text-align:center;

        margin-top:20px;

        }

        .loading i{

        font-size:28px;

        color:#003a8f;

        animation:spin 1s linear infinite;

        }

        @keyframes spin{

        100%{

        transform:rotate(360deg);

        }

        }

        .success{

        display:none;

        text-align:center;

        margin-top:20px;

        color:green;

        font-weight:bold;

        }

    </style>

</head>

<body>

<div class="bg"></div>

<div class="container">

    <div class="logo">

        <h1>ABI BANK</h1>

        <p>Forgot Password</p>

    </div>

    <div class="input-box">

        <i class="fa fa-user"></i>

        <input
                type="text"
                id="userId"
                placeholder="User ID">

    </div>

    <div class="input-box">

        <i class="fa fa-phone"></i>

        <input
                type="text"
                id="mobile"
                placeholder="Registered Mobile Number">

    </div>





    <div class="input-box">

        <i class="fa fa-lock"></i>

        <input
                type="password"
                id="password"
                placeholder="New Password">

        <span
                class="eye"
                onclick="togglePassword('password',this)">
<i class="fa fa-eye"></i>
</span>

    </div>

    <div class="input-box">

        <i class="fa fa-lock"></i>

        <input
                type="password"
                id="confirm"
                placeholder="Confirm Password">

        <span
                class="eye"
                onclick="togglePassword('confirm',this)">
<i class="fa fa-eye"></i>
</span>

    </div>

    <div
            class="strength"
            id="strength">

        Password Strength

    </div>

    <button
            onclick="resetPassword()">

        Reset Password

    </button>

    <div
            class="loading"
            id="loading">

        <i class="fa fa-spinner"></i>

        <p>Please wait...</p>

    </div>

    <div
            class="success"
            id="success">

        Password Updated Successfully ✔

    </div>

    <a
            href="login.html"
            class="back">

        ← Back to Login

    </a>

</div>
<script>

    function resetPassword(){

    let data={

        userId:document.getElementById("userId").value,

        mobile:document.getElementById("mobile").value,

        password:document.getElementById("password").value

    };

    if(data.password!=document.getElementById("confirm").value){

        alert("Passwords do not match");

        return;
    }

    fetch("http://localhost:8080/forgotPassword",{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

    })

    .then(res=>res.text())

    .then(msg=>{

        alert(msg);

        if(msg=="Password Updated Successfully"){

            location.href="login.html";

        }

    });

}
    function togglePassword(inputId, element) {

    const input = document.getElementById(inputId);

    const icon = element.querySelector("i");

    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    } else {

        input.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }
}
</script>

</body>
</html>
