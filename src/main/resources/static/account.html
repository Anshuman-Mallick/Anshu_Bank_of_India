<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>ABI Bank Accounts</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial,sans-serif;
        }

        body{
        background:#edf2f8;
        }

        .topbar{

        height:70px;

        background:#ffb000;

        display:flex;

        justify-content:space-between;

        align-items:center;

        padding:0 35px;

        position:fixed;

        width:100%;

        top:0;

        left:0;

        z-index:999;
        }

        .logo{

        display:flex;

        align-items:center;

        gap:15px;
        }

        .logo h1{

        color:#003a8f;
        }

        .logout{

        padding:10px 22px;

        background:#003a8f;

        color:white;

        border:none;

        border-radius:30px;

        cursor:pointer;
        }

        .container{

        display:flex;

        margin-top:70px;
        }

        .sidebar{

        width:250px;

        background:#003a8f;

        min-height:100vh;

        padding:25px;

        color:white;
        }

        .profile{

        text-align:center;

        margin-bottom:30px;
        }

        .profile img{

        width:110px;

        height:110px;

        border-radius:50%;

        border:4px solid white;

        object-fit:cover;
        }

        .profile h3{

        margin-top:15px;
        }

        .sidebar a{

        display:block;

        color:white;

        text-decoration:none;

        padding:14px;

        margin-top:8px;

        border-radius:10px;

        transition:.3s;
        }

        .sidebar a:hover{

        background:rgba(255,255,255,.2);
        }

        .sidebar i{

        margin-right:10px;
        }

        .main{

        flex:1;

        padding:35px;
        }

        .summary{

        background:linear-gradient(135deg,#003a8f,#009688);

        padding:30px;

        border-radius:20px;

        color:white;

        display:flex;

        justify-content:space-between;

        align-items:center;
        }

        .summary h1{

        margin-top:15px;

        font-size:42px;
        }

        .cards{

        display:grid;

        grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

        gap:25px;

        margin-top:30px;
        }

        .card{

        background:white;

        padding:25px;

        border-radius:20px;

        box-shadow:0 5px 20px rgba(0,0,0,.1);
        }

        .card h3{

        color:#003a8f;

        margin-bottom:20px;
        }

        .info{

        margin:15px 0;

        display:flex;

        justify-content:space-between;

        border-bottom:1px solid #eee;

        padding-bottom:8px;
        }

        .editBtn{

        margin-top:20px;

        padding:12px 25px;

        border:none;

        background:#ffb000;

        border-radius:25px;

        font-weight:bold;

        cursor:pointer;
        }

    </style>

</head>

<body>

<div class="topbar">

    <div class="logo">

        <h1> ABI BANK</h1>

    </div>

    <button class="logout"
            onclick="location.href='dashboard.html'">

        Dashboard

    </button>

</div>

<div class="container">

    <div class="sidebar">

        <div class="profile">

            <img id="profileImage"
                 src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

            <h3 id="customerName">Customer</h3>

            <p id="customerId"></p>

        </div>

        <a href="dashboard.html">
            <i class="fa fa-home"></i>
            Dashboard
        </a>


    </div>

    <div class="main">

        <div class="summary">

            <div>

                <h2>ABI Savings Account</h2>

                <p>IFSC : ABI0001234</p>

                <h1 id="balance">₹0</h1>

            </div>

            <div>

                <h2>Status</h2>

                <h1 style="font-size:28px;color:#90ff90">
                    ACTIVE
                </h1>

            </div>

        </div>

        <div class="cards">

            <div class="card">

                <h3>Account Information</h3>

                <div class="info">

                    <span>Account Number</span>

                    <b id="accountNumber"></b>

                </div>

                <div class="info">

                    <span>User ID</span>

                    <b id="userId"></b>

                </div>

                <div class="info">

                    <span>Branch</span>

                    <b>Kolkata</b>

                </div>

                <div class="info">

                    <span>Account Type</span>

                    <b>Savings</b>

                </div>

            </div>

            <div class="card">

                <h3>Customer Information</h3>

                <div class="info">

                    <span>Full Name</span>

                    <b id="fullName"></b>

                </div>

                <div class="info">

                    <span>Mobile</span>

                    <b id="mobile"></b>

                </div>

                <div class="info">

                    <span>Email</span>

                    <b id="email"></b>

                </div>

                <div class="info">

                    <span>PAN</span>

                    <b id="pan"></b>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

    const userId=localStorage.getItem("abiUserId");

    fetch("http://localhost:8080/dashboard/"+userId)

    .then(r=>r.json())

    .then(data=>{

    document.getElementById("customerName").innerHTML=data.fullName;

    document.getElementById("customerId").innerHTML=data.userId;

    document.getElementById("profileImage").src=data.profilePhoto;

    document.getElementById("balance").innerHTML="₹ "+data.balance;

    document.getElementById("accountNumber").innerHTML="4500"+data.id+"721242";

    document.getElementById("userId").innerHTML=data.userId;

    document.getElementById("fullName").innerHTML=data.fullName;

    document.getElementById("mobile").innerHTML=data.mobile;

    document.getElementById("email").innerHTML=data.email;

    document.getElementById("pan").innerHTML=data.pan;

    });

</script>

</body>
</html>
